name: Validate package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in router/install-web.sh router/opt/etc/init.d/S101awg3-web router/update-importer.sh router/install.sh router/uninstall.sh router/opt/bin/awg3-split-config router/opt/etc/init.d/S99awg3 router/opt/etc/init.d/S100awg3-watchdog; do sh -n "$f"; done
      - name: Parser and service regressions
        run: |
          sh tests/test_split_config.sh
          sh tests/test_parser_edge_cases.sh
          sh tests/test_service.sh
          sh tests/test_web_service.sh
      - name: Offline converter tests
        run: python3 -m unittest discover -s tests -p test_converter.py -v
      - name: HTTPS panel tests
        run: python3 -m unittest discover -s tests -p test_web.py -v
      - name: PingCheck firmware regression tests
        run: python3 -m unittest discover -s tests -p test_pingcheck.py -v
      - name: Updater transaction tests
        run: python3 -m unittest discover -s tests -p test_updater.py -v
      - name: Validate binary metadata and package
        run: python3 build/package.py
